<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182333" />
      <stop offset="100%" stop-color="#090f17" />
    </radialGradient>
    <linearGradient id="starLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#bgStar)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
  <!-- Shield Badge Outline -->
  <path d="M50 18 L76 28 C76 56 64 74 50 82 C36 74 24 56 24 28 Z" fill="#171C20" stroke="#0ea5e9" stroke-width="2.5" />
  <!-- Big 5-pointed star -->
  <polygon points="50,28 56,42 71,42 59,51 63,66 50,57 37,66 41,51 29,42 44,42" fill="url(#starLime)" filter="url(#starGlow)" />
  <!-- '5' text in center -->
  <text x="50" y="55" text-anchor="middle" fill="#080B0D" font-size="14" font-weight="900" font-family="sans-serif">5</text>
  <!-- Mini decorative stars -->
  <polygon points="50,72 51,75 54,75 52,77 53,80 50,78 47,80 48,77 46,75 49,75" fill="#38bdf8" />
</svg>

