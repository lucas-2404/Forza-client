<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgClock" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1d3b" />
      <stop offset="100%" stop-color="#0e0a14" />
    </radialGradient>
    <linearGradient id="limeClock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9EF01A" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="clockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#bgClock)" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" />
  <!-- Stopwatch Top Button -->
  <rect x="46" y="14" width="8" height="6" rx="2" fill="#71717a" />
  <rect x="44" y="20" width="12" height="3" rx="1.5" fill="#a1a1aa" />
  <rect x="68" y="22" width="6" height="4" rx="1" transform="rotate(35 71 24)" fill="#71717a" />
  <!-- Stopwatch Body -->
  <circle cx="50" cy="54" r="28" fill="#171C20" stroke="#7c3aed" stroke-width="3" />
  <circle cx="50" cy="54" r="23" fill="#0D1114" stroke="#9EF01A" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Tick Marks -->
  <line x1="50" y1="33" x2="50" y2="36" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="72" x2="50" y2="75" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="29" y1="54" x2="32" y2="54" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="54" x2="71" y2="54" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <!-- Hands pointing to 60 min (vertical) with lime glow -->
  <line x1="50" y1="54" x2="50" y2="36" stroke="url(#limeClock)" stroke-width="3.5" stroke-linecap="round" filter="url(#clockGlow)" />
  <line x1="50" y1="54" x2="62" y2="48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="54" r="3.5" fill="#FFFFFF" />
  <!-- Text '60m' -->
  <text x="50" y="66" text-anchor="middle" fill="#9EF01A" font-size="9" font-weight="bold" font-family="sans-serif">60m</text>
</svg>

