<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="rachaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#080B0D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="flame1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="flame2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#9EF01A" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="flameBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#rachaGlow)" />
  <!-- Outer flame tongues -->
  <path d="M50 8 C54 22 66 28 72 40 C80 56 70 78 50 86 C30 78 20 56 28 40 C34 28 46 22 50 8 Z" fill="url(#flame1)" filter="url(#flameBlur)" />
  <!-- Middle tongue left -->
  <path d="M42 32 C38 42 32 50 36 64 C40 72 48 76 50 76 C42 70 42 60 46 50 C48 44 48 38 42 32 Z" fill="#f97316" />
  <!-- Center flame with electric lime spark -->
  <path d="M50 30 C53 40 62 46 64 54 C67 64 60 74 50 78 C40 74 33 64 36 54 C38 46 47 40 50 30 Z" fill="url(#flame2)" />
  <!-- Core white hot spark -->
  <ellipse cx="50" cy="65" rx="5" ry="7" fill="#ffffff" />
  <!-- Ember particles -->
  <circle cx="32" cy="30" r="1.5" fill="#fde047" />
  <circle cx="68" cy="26" r="2" fill="#9EF01A" />
  <circle cx="52" cy="18" r="1.5" fill="#ffffff" />
</svg>

