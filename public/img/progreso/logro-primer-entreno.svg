<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2c18" />
      <stop offset="100%" stop-color="#0d140e" />
    </radialGradient>
    <linearGradient id="limeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf746" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad1)" stroke="#9EF01A" stroke-width="2" stroke-opacity="0.5" />
  <!-- Ribbons -->
  <path d="M38 60 L32 86 L44 80 L50 86 L46 62 Z" fill="#4d7c0f" opacity="0.8" />
  <path d="M62 60 L68 86 L56 80 L50 86 L54 62 Z" fill="#3f6212" opacity="0.8" />
  <!-- Medal Rim -->
  <circle cx="50" cy="45" r="25" fill="#171C20" stroke="url(#limeGrad1)" stroke-width="3" filter="url(#glow1)" />
  <circle cx="50" cy="45" r="21" fill="#0D1114" stroke="#9EF01A" stroke-dasharray="3,2" stroke-width="1" />
  <!-- Dumbbell / Trophy Icon inside medal -->
  <path d="M42 38 L42 52 M58 38 L58 52 M40 45 L60 45" stroke="url(#limeGrad1)" stroke-width="3.5" stroke-linecap="round" />
  <rect x="36" y="40" width="4" height="10" rx="1.5" fill="#9EF01A" />
  <rect x="60" y="40" width="4" height="10" rx="1.5" fill="#9EF01A" />
  <!-- Star on top -->
  <polygon points="50,26 52,31 57,31 53,34 55,39 50,36 45,39 47,34 43,31 48,31" fill="#FFFFFF" />
</svg>

