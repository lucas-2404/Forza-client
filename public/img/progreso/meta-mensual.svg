<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="targetBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b2e10" />
      <stop offset="100%" stop-color="#080B0D" />
    </radialGradient>
    <filter id="targetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#targetBg)" stroke="rgba(158, 240, 26, 0.2)" stroke-width="1.5" />
  <!-- Outer concentric ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#2A3035" stroke-width="3" />
  <!-- Middle concentric ring with dashed precision -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#9EF01A" stroke-width="2.5" stroke-dasharray="4,3" stroke-opacity="0.8" />
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="18" fill="#171C20" stroke="#9EF01A" stroke-width="3" filter="url(#targetGlow)" />
  <!-- Center Bullseye with electric lime glow -->
  <circle cx="50" cy="50" r="9" fill="#9EF01A" />
  <circle cx="50" cy="50" r="4" fill="#080B0D" />
  <!-- Crosshairs -->
  <line x1="50" y1="6" x2="50" y2="20" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="80" x2="50" y2="94" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="6" y1="50" x2="20" y2="50" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="80" y1="50" x2="94" y2="50" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
</svg>

