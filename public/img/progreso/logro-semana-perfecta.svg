<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDiamond" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a30" />
      <stop offset="100%" stop-color="#061214" />
    </radialGradient>
    <linearGradient id="diamondCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="diamondGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#bgDiamond)" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.5" />
  <!-- Radiant Rays -->
  <line x1="50" y1="12" x2="50" y2="18" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="82" x2="50" y2="88" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="14" y1="50" x2="20" y2="50" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <line x1="80" y1="50" x2="86" y2="50" stroke="#9EF01A" stroke-width="2" stroke-linecap="round" />
  <!-- Diamond Gem Shape -->
  <!-- Top facets -->
  <polygon points="32,38 40,24 60,24 68,38" fill="#a5f3fc" />
  <polygon points="40,24 50,38 60,24" fill="#cffafe" />
  <polygon points="32,38 40,24 50,38" fill="#67e8f9" />
  <polygon points="68,38 60,24 50,38" fill="#67e8f9" />
  <!-- Bottom facets with lime & cyan reflection -->
  <polygon points="32,38 50,76 50,38" fill="#0891b2" filter="url(#diamondGlow)" />
  <polygon points="68,38 50,76 50,38" fill="#0e7490" />
  <polygon points="42,38 50,76 50,38" fill="#9EF01A" opacity="0.8" />
  <!-- Crown / Star sparkle -->
  <polygon points="26,26 28,30 32,30 29,32 30,36 26,34 22,36 23,32 20,30 24,30" fill="#9EF01A" />
  <polygon points="74,26 76,30 80,30 77,32 78,36 74,34 70,36 71,32 68,30 72,30" fill="#FFFFFF" />
  <!-- '7' on bottom -->
  <text x="50" y="58" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" font-family="sans-serif">7D</text>
</svg>

