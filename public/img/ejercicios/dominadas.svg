<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="ejBg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141f25" />
      <stop offset="100%" stop-color="#080B0D" />
    </radialGradient>
    <linearGradient id="latsLime" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#9EF01A" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#ejBg3)" stroke="#2A3035" stroke-width="1.5" />
  <!-- Pull up bar -->
  <line x1="16" y1="28" x2="104" y2="28" stroke="#a1a1aa" stroke-width="5" stroke-linecap="round" />
  <line x1="24" y1="28" x2="24" y2="10" stroke="#3f3f46" stroke-width="4" />
  <line x1="96" y1="28" x2="96" y2="10" stroke="#3f3f46" stroke-width="4" />
  <!-- Athlete Head -->
  <circle cx="60" cy="34" r="7" fill="#71717a" />
  <!-- Wide-grip arms bent at elbows -->
  <path d="M34 28 L46 44 L56 50" stroke="#9EF01A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M86 28 L74 44 L64 50" stroke="#9EF01A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Back V-Taper (Lats highlighted with Lime green gradient) -->
  <polygon points="54,48 66,48 72,66 64,82 56,82 48,66" fill="url(#latsLime)" />
  <!-- Legs crossed slightly -->
  <path d="M57 82 L55 106 L62 108" stroke="#52525b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M63 82 L65 102 L58 106" stroke="#3f3f46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Tag -->
  <rect x="68" y="8" width="44" height="15" rx="4" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="0.8" />
  <text x="90" y="19" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="bold" font-family="sans-serif">ESPALDA</text>
</svg>

