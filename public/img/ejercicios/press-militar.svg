  <!-- Torso & Bench backrest -->
  <line x1="60" y1="82" x2="60" y2="108" stroke="#3f3f46" stroke-width="8" stroke-linecap="round" />
  <!-- Tag -->
  <rect x="68" y="8" width="44" height="15" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="0.8" />
  <text x="90" y="19" text-anchor="middle" fill="#c084fc" font-size="8" font-weight="bold" font-family="sans-serif">HOMBROS</text>
</svg>

