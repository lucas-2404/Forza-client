<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="ejBg5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241a10" />
      <stop offset="100%" stop-color="#080B0D" />
    </radialGradient>
    <linearGradient id="deadliftLime" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#9EF01A" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#ejBg5)" stroke="#2A3035" stroke-width="1.5" />
  <!-- Athlete in Hip Hinge Position (Deadlift) -->
  <circle cx="78" cy="40" r="7" fill="#71717a" />
  <!-- Flat back / spine (Hamstring / Erector spinae highlight in lime) -->
  <path d="M74 46 L46 62" stroke="url(#deadliftLime)" stroke-width="8" stroke-linecap="round" />
  <!-- Hip hinge & Hamstrings/Glutes -->
  <path d="M46 62 L42 86 L48 106" stroke="#9EF01A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M50 64 L54 86 L56 106" stroke="#65a30d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Long arms holding barbell below knees -->
  <path d="M68 50 L64 78" stroke="#71717a" stroke-width="5" stroke-linecap="round" />
  <!-- Barbell -->
  <line x1="20" y1="80" x2="100" y2="80" stroke="#a1a1aa" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="28" cy="80" r="14" fill="#171C20" stroke="#9EF01A" stroke-width="2" />
  <circle cx="92" cy="80" r="14" fill="#171C20" stroke="#9EF01A" stroke-width="2" />
  <!-- Ground -->
  <line x1="14" y1="108" x2="106" y2="108" stroke="#3f3f46" stroke-width="2" />
  <!-- Tag -->
  <rect x="62" y="8" width="50" height="15" rx="4" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="0.8" />
  <text x="87" y="19" text-anchor="middle" fill="#f97316" font-size="8" font-weight="bold" font-family="sans-serif">P. MUERTO</text>
</svg>

