<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="ejBg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2514" />
      <stop offset="100%" stop-color="#080B0D" />
    </radialGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#ejBg2)" stroke="#2A3035" stroke-width="1.5" />
  <!-- Squat Rack posts -->
  <line x1="18" y1="20" x2="18" y2="108" stroke="#27272a" stroke-width="3" />
  <line x1="102" y1="20" x2="102" y2="108" stroke="#27272a" stroke-width="3" />
  <!-- Ground line -->
  <line x1="14" y1="108" x2="106" y2="108" stroke="#3f3f46" stroke-width="2" />
  <!-- Athlete in Deep Squat -->
  <!-- Head -->
  <circle cx="60" cy="40" r="7" fill="#71717a" />
  <!-- Torso leaning forward slightly -->
  <path d="M60 47 L60 68" stroke="#71717a" stroke-width="8" stroke-linecap="round" />
  <!-- Quads / Thighs (Parallel to ground, highlighted lime) -->
  <path d="M60 68 L42 70" stroke="#9EF01A" stroke-width="7" stroke-linecap="round" />
  <!-- Calves / Lower leg going down to feet -->
  <path d="M42 70 L44 98 L36 100" stroke="#9EF01A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Other leg (depth illusion) -->
  <path d="M60 68 L76 72 L72 98 L80 100" stroke="#65a30d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Barbell resting on traps -->
  <line x1="14" y1="44" x2="106" y2="44" stroke="url(#barGrad2)" stroke-width="4.5" stroke-linecap="round" />
  <!-- Big plates on bar -->
  <rect x="22" y="24" width="7" height="40" rx="2" fill="#171C20" stroke="#9EF01A" stroke-width="1.5" />
  <rect x="91" y="24" width="7" height="40" rx="2" fill="#171C20" stroke="#9EF01A" stroke-width="1.5" />
  <!-- Tag -->
  <rect x="68" y="8" width="44" height="15" rx="4" fill="rgba(158, 240, 26, 0.15)" stroke="#9EF01A" stroke-width="0.8" />
  <text x="90" y="19" text-anchor="middle" fill="#9EF01A" font-size="8" font-weight="bold" font-family="sans-serif">PIERNAS</text>
</svg>

