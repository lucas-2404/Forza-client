<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="ejBg6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19281a" />
      <stop offset="100%" stop-color="#080B0D" />
    </radialGradient>
    <linearGradient id="coreLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#9EF01A" />
      <stop offset="100%" stop-color="#bbf746" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#ejBg6)" stroke="#2A3035" stroke-width="1.5" />
  <!-- Exercise Mat -->
  <line x1="16" y1="92" x2="104" y2="92" stroke="#27272a" stroke-width="5" stroke-linecap="round" />
  <!-- Athlete Head -->
  <circle cx="86" cy="56" r="6.5" fill="#71717a" />
  <!-- Forearms on ground -->
  <line x1="82" y1="70" x2="82" y2="90" stroke="#71717a" stroke-width="4.5" stroke-linecap="round" />
  <line x1="82" y1="90" x2="90" y2="90" stroke="#71717a" stroke-width="4.5" stroke-linecap="round" />
  <!-- Straight plank body (Core highlighted with intense lime glow) -->
  <line x1="80" y1="68" x2="32" y2="76" stroke="url(#coreLime)" stroke-width="7.5" stroke-linecap="round" />
  <!-- Feet / Toes on ground -->
  <line x1="32" y1="76" x2="26" y2="90" stroke="#52525b" stroke-width="4.5" stroke-linecap="round" />
  <line x1="26" y1="90" x2="22" y2="90" stroke="#52525b" stroke-width="4.5" stroke-linecap="round" />
  <!-- Core tension pulse indicator -->
  <circle cx="56" cy="72" r="5" fill="#9EF01A" opacity="0.8" />
  <circle cx="56" cy="72" r="9" fill="none" stroke="#9EF01A" stroke-width="1" stroke-dasharray="2,2" />
  <!-- Tag -->
  <rect x="68" y="8" width="44" height="15" rx="4" fill="rgba(158, 240, 26, 0.15)" stroke="#9EF01A" stroke-width="0.8" />
  <text x="90" y="19" text-anchor="middle" fill="#9EF01A" font-size="8" font-weight="bold" font-family="sans-serif">ABDOMEN</text>
</svg>

