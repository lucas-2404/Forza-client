  <line x1="56" y1="76" x2="52" y2="108" stroke="#52525b" stroke-width="5" stroke-linecap="round" />
  <line x1="64" y1="76" x2="68" y2="108" stroke="#52525b" stroke-width="5" stroke-linecap="round" />
  <!-- Biceps flexed & curled up (Lime green) -->
