      <stop offset="0%" stop-color="#14221a" />
      <stop offset="100%" stop-color="#080B0D" />
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="16" fill="url(#ejBg8)" stroke="#2A3035" stroke-width="1.5" />
